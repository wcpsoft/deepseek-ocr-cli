[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2", "toml>=0.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-ocr-cli"
version = "1.0.0"
description = "DeepSeek OCR CLI - 基于视觉编码器与大语言模型的光学字符识别系统命令行工具"
readme = "README.md"
authors = [
    {name = "Rxzhang", email = "rxzhang@example.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF",
    "img2pdf",
    "einops",
    "easydict",
    "addict",
    "Pillow",
    "numpy",
    "huggingface-hub",
    "fsspec",
    "modelscope",
    "matplotlib",
    "toml",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "tqdm",
    "psutil",
    "transformers",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.1",
    "pre-commit>=2.17.0",
    "ruff>=0.1.0",
    "ipdb>=0.13.0",
]
# 保留空的平台特定依赖组以保持API兼容性
nvidia = []
amd = []
cpu = []
mps = []
dcu = []

[project.scripts]
deepseek-ocr = "cli.main:main"
deepseek-ocr-download = "cli.download_models:main"
deepseek-ocr-detect-gpu = "dev.detect_gpu:main"
deepseek-ocr-debug = "dev.debug:main"
deepseek-ocr-code-check = "dev.auto_check_code_style:main"

[project.urls]
Homepage = "https://github.com/wcpsoft/deepseek-ocr-cli"
Repository = "https://github.com/wcpsoft/deepseek-ocr-cli.git"
Documentation = "https://github.com/wcpsoft/deepseek-ocr-cli/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["src*", "cli*"]
exclude = ["assets*", "tests*"]

[tool.setuptools.package-data]
cli = ["*.py"]
src = ["*.py"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:<frozen importlib._bootstrap>",
    "ignore::DeprecationWarning:.*fitz.*",
    "ignore::DeprecationWarning:.*builtin type.*has no __module__ attribute.*",
    "ignore::DeprecationWarning",
    "ignore::UserWarning:.*Unable to register.*factory.*",
    "ignore::UserWarning:.*computation placer already registered.*",
    "ignore::UserWarning:.*User provided device_type of 'cuda', but CUDA is not available.*",
    # 过滤transformers库的get_max_cache弃用警告
    "ignore::FutureWarning:.*get_max_cache.*is deprecated.*",
]
testpaths = [
    "tests",
]

[tool.black]
# 与isort保持一致的行长度
line-length = 120
# 目标Python版本
target-version = ['py310']
# 排除template目录
exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | template
)/
'''

[tool.isort]
# 使用black配置文件以确保兼容性
profile = "black"
line_length = 120
# 避免与black冲突的配置
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
# 排除template目录
skip = ["template"]

[tool.ruff]
# 行长度限制，与black和isort保持一致
line-length = 120
# 目标Python版本
target-version = "py310"
# 排除template目录
exclude = [
    "template/",
]

[tool.ruff.lint]
# 启用的规则
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # mccabe
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "YTT",  # flake8-2020
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "RUF",  # Ruff-specific rules
]
# 忽略的规则
extend-ignore = [
    "ANN001",  # Missing type annotation for function argument
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN101",  # Missing type annotation for self in method
    "ANN102",  # Missing type annotation for cls in classmethod
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ANN204",  # Missing return type annotation for special method __init__
    "BLE001",  # Blind except
    "E203",    # Whitespace before ':'
    "E302",    # Expected 2 blank lines
    "E303",    # Too many blank lines
    "E305",    # Expected 2 blank lines after class or function definition
    "E402",    # Module level import not at top of file
    "E501",    # Line too long
    "E721",    # Do not compare types, use isinstance()
    "E731",    # Do not assign a lambda expression, use a def
    "E741",    # Ambiguous variable name
    "EXE001",  # Shebang is present but file is not executable
    "F405",    # Name may be undefined, or defined from star imports
    "F821",    # Undefined name
    "F841",    # Local variable is assigned to but never used
    "G004",    # Logging statement uses f-string
    "ISC001",  # Implicitly concatenated string literals on one line
    "N812",    # Lowercase imported as non-lowercase
    "N817",    # Camelcase imported as acronym
    "RUF001",  # String contains ambiguous unicode character
    "RUF002",  # Docstring contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password
    "S603",    # subprocess call: check for execution of untrusted input
    "UP045",   # Use `X | None` for type annotations
    "W291",    # Trailing whitespace
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/**/*" = ["S101", "S105"]  # Use of assert detected, possible hardcoded password
"dev/**/*" = ["S603"]  # subprocess call: check for execution of untrusted input
"template/**/*" = ["ALL"]  # 排除template目录的所有检查

[tool.mypy]
# Python版本
python_version = "3.10"
# 显示错误代码
show_error_codes = true
# 严格模式
strict = true
# 忽略缺失的导入
ignore_missing_imports = true
# 禁用特定的严格检查
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
# 排除template目录
exclude = ["template/"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "PIL.*",
    "numpy.*",
    "tqdm.*",
    "matplotlib.*",
    "einops.*",
    "easydict.*",
    "addict.*",
    "fitz.*",
    "img2pdf.*",
    "huggingface_hub.*",
    "fsspec.*",
    "modelscope.*",
    "toml.*",
    "fastapi.*",
    "uvicorn.*",
    "psutil.*",
    "PyYAML.*",
    "setuptools.*",
    "wheel.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.1",
    "pre-commit>=2.17.0",
    "ruff>=0.1.0",
    "ipdb>=0.13.0",
]