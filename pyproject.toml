[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2", "toml>=0.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-ocr-cli"
version = "1.0.0"
description = "DeepSeek OCR CLI - 基于视觉编码器与大语言模型的光学字符识别系统命令行工具"
readme = "README.md"
authors = [
    {name = "Rxzhang", email = "rxzhang@example.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF",
    "img2pdf",
    "einops",
    "easydict",
    "addict",
    "Pillow",
    "numpy",
    "huggingface-hub>=0.20.0",
    "fsspec>=2023.1.0,<=2025.3.0",
    "matplotlib",
    "toml>=0.10.2",
]

[project.optional-dependencies]
cli = [
    "huggingface-hub>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
modelscope = [
    "modelscope>=1.10.0",
]
nvidia = [
    "transformers<=4.51.1",
    "tokenizers<=0.22",
    "torch<2.6.1",
    "torchvision>=0.21.0",
    "torchaudio<2.6.1",
    "vllm>=0.8.5,<=0.10.1",
]
amd = [
    "transformers<=4.51.1",
    "tokenizers<=0.22",
    "torch<2.6.1",
    "torchvision>=0.21.0",
    "torchaudio<2.6.1",
    "vllm>=0.8.5,<=0.10.1",
]
cpu = [
    "transformers<=4.51.1",
    "tokenizers<=0.22",
    "torch<2.6.1",
    "torchvision>=0.21.0",
    "torchaudio<2.6.1",
    "vllm>=0.8.5,<=0.10.1",
]
mps = [
    "transformers<=4.51.1",
    "tokenizers<=0.22",
    "torch<2.6.1",
    "torchvision>=0.21.0",
    "torchaudio<2.6.1",
]
dcu = [
    "transformers<=4.51.1",
    "tokenizers<=0.22",
    "torch<2.6.1",
    "torchvision>=0.21.0",
    "torchaudio<2.6.1",
    "vllm>=0.8.5,<=0.10.1",
]

[project.scripts]
deepseek-ocr = "cli.main:main"
deepseek-ocr-download = "cli.download_models:main"
deepseek-ocr-detect-gpu = "dev.detect_gpu:main"

[project.urls]
Homepage = "https://github.com/wcpsoft/deepseek-ocr-cli"
Repository = "https://github.com/wcpsoft/deepseek-ocr-cli.git"
Documentation = "https://github.com/wcpsoft/deepseek-ocr-cli/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["src*", "cli*"]
exclude = ["assets*", "tests*"]

[tool.setuptools.package-data]
cli = ["*.py"]
src = ["*.py"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
vllm = [
    { index = "vllm-dcu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirrors.aliyun.com/pytorch-wheels/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://mirrors.aliyun.com/pytorch-wheels/rocm6.1"
explicit = true

[[tool.uv.index]]
name = "vllm-dcu"
url = "https://pypi.org/simple"
explicit = true
