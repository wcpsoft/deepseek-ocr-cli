[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2", "toml>=0.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-ocr-cli"
version = "1.0.0"
description = "DeepSeek OCR CLI - 基于视觉编码器与大语言模型的光学字符识别系统命令行工具"
readme = "README.md"
authors = [
    {name = "Rxzhang", email = "rxzhang@example.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF",
    "img2pdf",
    "einops",
    "easydict",
    "addict",
    "Pillow",
    "numpy",
    "huggingface-hub",
    "fsspec",
    "modelscope",
    "matplotlib",
    "toml",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.1",
    "pre-commit>=2.17.0",
]
# 保留空的平台特定依赖组以保持API兼容性
nvidia = []
amd = []
cpu = []
mps = []
dcu = []

[project.scripts]
deepseek-ocr = "cli.main:main"
deepseek-ocr-download = "cli.download_models:main"
deepseek-ocr-detect-gpu = "dev.detect_gpu:main"
deepseek-ocr-debug = "dev.debug:main"

[project.urls]
Homepage = "https://github.com/wcpsoft/deepseek-ocr-cli"
Repository = "https://github.com/wcpsoft/deepseek-ocr-cli.git"
Documentation = "https://github.com/wcpsoft/deepseek-ocr-cli/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["src*", "cli*"]
exclude = ["assets*", "tests*"]

[tool.setuptools.package-data]
cli = ["*.py"]
src = ["*.py"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:<frozen importlib._bootstrap>",
    "ignore::DeprecationWarning:.*fitz.*",
    "ignore::DeprecationWarning:.*builtin type.*has no __module__ attribute.*",
    "ignore::DeprecationWarning",
    "ignore::UserWarning:.*Unable to register.*factory.*",
    "ignore::UserWarning:.*computation placer already registered.*",
    "ignore::UserWarning:.*User provided device_type of 'cuda', but CUDA is not available.*",
]
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.1",
    "pre-commit>=2.17.0",
]